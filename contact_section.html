<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Mess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #f3faf6;
  }

  .card {
    border-radius: 15px;
  }

  /* ✅ Responsive container */
  .form-container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 10px;
  }

  /* ✅ Mobile friendly */
  @media (max-width: 576px) {
    .card {
      padding: 20px !important;
    }

    h3 {
      font-size: 20px;
    }

    .form-control,
    .form-select {
      font-size: 13px;
      padding: 8px;
    }

    .btn-custom {
      font-size: 14px;
      padding: 8px;
    }
  }

  .btn-custom {
    background: #22c55e;
    color: white;
    border: none;
  }

  .btn-custom:hover {
    background: #16a34a;
  }
</style>
</head>

<body>

<div class="container mt-5">
  <div class="row justify-content-center">
    
   <div class="form-container">
      <div class="card shadow p-4">

        <h3 class="text-center mb-3">📞 Contact Mess</h3>
        <p class="text-center text-muted">Send your complaint or feedback</p>

        <form id="contactForm">

          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" id="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Type</label>
            <select id="type" class="form-select">
              <option value="Complaint">Complaint</option>
              <option value="Feedback">Feedback</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea id="message" class="form-control" rows="4" required></textarea>
          </div>

          <button type="submit" class="btn btn-custom w-100">
            Send Message
          </button>

        </form>

      </div>
    </div>

  </div>
</div>

<!-- 🔥 Firebase Script -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 ADD THIS IMPORT */
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDkvK-s1RpsmoNjZLPGMnpsqLM_2Cjwiwc",
  authDomain:"smartmess-66441.firebaseapp.com",
  projectId:"smartmess-66441"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
/* 🔥 ADD THIS */
const auth = getAuth(app);

/* 🔥 AUTO-FILL CODE (इथे add करायचा 👇) */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const uid = user.uid;

    const snap = await getDoc(doc(db, "students", uid));

    if (snap.exists()) {
      const data = snap.data();

      document.getElementById("name").value = data.fullName;
      document.getElementById("email").value = data.email;

      // optional
      document.getElementById("name").disabled = true;
      document.getElementById("email").disabled = true;
    }
  }
});

/* EXISTING CODE */
const form = document.getElementById("contactForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const type = document.getElementById("type").value;
  const message = document.getElementById("message").value;

  await addDoc(collection(db, "messages"), {
    name,
    email,
    type,
    message,
    status: "pending",
    createdAt: new Date()
  });

  alert("Message sent ✅");
  form.reset();
});

</script>

</body>
</html>
