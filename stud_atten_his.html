<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Attendance History | Smart Mess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f3faf6;
    }

    .card {
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="container mt-4">
    <p class="text-muted">Your meal attendance records</p>
    <h3>📅 Attendance History</h3>
    <p class="text-muted">Your meal attendance records</p>

    <!-- 🔽 इथे add कर -->
    <div class="mb-3">
      <label class="form-label">📅 Select Month</label>
      <input type="month" id="monthPicker" class="form-control">
    </div>


    <!-- STUDENT INFO -->
    <div class="card shadow p-3 mb-3">
      <strong id="studentName">Loading...</strong><br>
      <span id="studentEmail" class="text-muted"></span>
    </div>

    <div class="card shadow p-4 mt-3">
      <table class="table table-bordered text-center">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Lunch</th>
            <th>Dinner</th>
            <th>Plate</th>
            <th>Time</th>
          </tr>
        </thead>

        <tbody id="historyTable">
          <tr>
            <td colspan="5">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

    import {
      getAuth, onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";


    import {
      getFirestore,
      collection, query, where, getDocs,
      doc, getDoc, orderBy
    } from
      "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";




    /* FIREBASE CONFIG */
    const firebaseConfig = {
      apiKey: "AIzaSyDkvK-s1RpsmoNjZLPGMnpsqLM_2Cjwiwc",
      authDomain: "smartmess-66441.firebaseapp.com",
      projectId: "smartmess-66441"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* AUTH CHECK */
    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "stu_login.html";
        return;
      }

      const uid = user.uid;
      const email = user.email;

      const monthPicker = document.getElementById("monthPicker");

      // default = current month
      const now = new Date();
      monthPicker.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;


      /* LOAD STUDENT INFO */
      const studentSnap = await getDoc(doc(db, "students", uid));
      if (studentSnap.exists()) {
        const s = studentSnap.data();

        if (s.isActive === false) {
    alert("You have left the mess.");
    window.location.href = "stu_login.html";
    return;
  }
        document.getElementById("studentName").innerText = s.fullName;
        document.getElementById("studentEmail").innerText = s.email;
      } else {
        alert("Unauthorized access");
        window.location.href = "stu_login.html";
        return;
      }


      async function loadAttendance() {
        const table = document.getElementById("historyTable");
        table.innerHTML = "";

        const selectedMonth = monthPicker.value;

        const q1 = query(
          collection(db, "attendance"),
          where("uid", "==", uid),
          orderBy("createdAt", "desc")
        );

        const snap1 = await getDocs(q1);
        const dayMap = {};

        snap1.forEach(docSnap => {
          const d = docSnap.data();
          if (!d.date.startsWith(selectedMonth)) return;

          if (!dayMap[d.date]) {
            dayMap[d.date] = {
              lunch: false,
              dinner: false,
              plates: [],
              times: []
            };
          }

          if (d.mealType === "lunch") dayMap[d.date].lunch = true;
          if (d.mealType === "dinner") dayMap[d.date].dinner = true;

          dayMap[d.date].plates.push(d.plateType);
          dayMap[d.date].times.push(
            d.createdAt?.toDate().toLocaleTimeString() || "-"
          );
        });

        if (Object.keys(dayMap).length === 0) {
          table.innerHTML = `
      <tr>
        <td colspan="5">No attendance found</td>
      </tr>
    `;
          return;
        }

        Object.keys(dayMap).sort().forEach(date => {
          const d = dayMap[date];
          table.innerHTML += `
      <tr>
        <td>${date}</td>
        <td>${d.lunch ? "✅" : "❌"}</td>
        <td>${d.dinner ? "✅" : "❌"}</td>
        <td>${d.plates.join(", ")}</td>
        <td>${d.times.join(", ")}</td>
      </tr>
    `;
        });
      }
      // page load
      loadAttendance();

      // month change
      monthPicker.addEventListener("change", loadAttendance);


    });


  </script>

</body>

</html>
