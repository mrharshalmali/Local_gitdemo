<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Bill | Smart Mess</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f3faf6; }
.card { border-radius:12px; }
</style>
</head>

<body>

<div class="container mt-4">

  <h2>💳 My Monthly Bill</h2>
  <p class="text-muted">View your mess bill generated by admin</p>

  <!-- STUDENT INFO -->
  <div class="card shadow p-3 mb-3">
    <strong id="studentName">Loading...</strong><br>
    <span id="studentEmail" class="text-muted"></span>
  </div>

  <!-- MONTH SELECT -->
  <input type="month" id="billMonth" class="form-control w-25 mb-3">

  <!-- BILL DETAILS -->
  <div id="billBox"></div>

</div>

<script type="module">

/* FIREBASE */
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";




import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDkvK-s1RpsmoNjZLPGMnpsqLM_2Cjwiwc",
  authDomain: "smartmess-66441.firebaseapp.com",
  projectId: "smartmess-66441"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let uid = "";
let messCode = "";

/* AUTH CHECK */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "stu_login.html";
    return;
  }

  uid = user.uid;

  // Load student info
  const snap = await getDoc(doc(db, "students", uid));
  if (snap.exists()) {
    const s = snap.data();
    studentName.innerText = s.fullName;
    studentEmail.innerText = s.email;
    messCode = s.messCode;
  }
});

/* LOAD BILL */
billMonth.addEventListener("change", async () => {

  const month = billMonth.value;
  if (!month) return;

  const billId = `${messCode}_${month}_${uid}`;
  const billRef = doc(db, "bills", billId);
  const billSnap = await getDoc(billRef);

  if (!billSnap.exists()) {
    billBox.innerHTML = `
      <div class="alert alert-warning">
        Bill not generated yet for selected month
      </div>`;
    return;
  }

  const b = billSnap.data();

  billBox.innerHTML = `
  <div class="card shadow p-4">
    <h5 class="mb-1">${b.studentName}</h5>
    <p class="text-muted">${b.studentEmail}</p>

    <hr>

    <p><strong>Month:</strong> ${b.month}</p>
    <p><strong>Total Amount:</strong> ₹ ${b.amount}</p>

    <p>
      <strong>Status:</strong>
      <span class="badge ${
        b.paymentStatus === "Paid" ? "bg-success" : "bg-danger"
      }">
        ${b.paymentStatus}
      </span>
    </p>

    ${
      b.paymentStatus === "Unpaid"
        ? `
        <hr>
        <h5>💳 Pay Monthly Bill</h5>

        <p>
          <strong>Pay to UPI ID:</strong>
          <span class="text-success" id="upiText">Loading...</span>
        </p>

        <input type="text"
               id="txnId"
               class="form-control mb-2"
               placeholder="Enter Transaction ID">

        <button class="btn btn-success w-100"
                onclick="submitPayment('${billId}', ${b.amount})">
          Submit Payment
        </button>
        `
        : ""
    }
  </div>
`;

const upiSnap = await getDoc(doc(db, "payment_settings", messCode));
if (upiSnap.exists()) {
  const upiText = document.getElementById("upiText");
  if (upiText) {
    upiText.innerText = upiSnap.data().upiId;
  }
}


});

window.submitPayment = async (billId, amount) => {

  const txnId = document.getElementById("txnId").value;

  if (!txnId) {
    alert("Please enter Transaction ID");
    return;
  }

  await setDoc(doc(db, "payments", billId), {
  billId: billId,
  uid: uid,
  studentName: studentName.innerText,
  studentEmail: studentEmail.innerText,
  messCode: messCode,
  month: billMonth.value,
  amount: amount,
  transactionId: txnId,
  status: "Pending",
  createdAt: new Date()
});


  alert("Payment submitted successfully ✅\nWaiting for admin verification");

  location.reload();
};

</script>

</body>
</html>
